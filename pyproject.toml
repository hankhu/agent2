[project]
name = "agent2"
version = "0.1.3.10"
description = "A modular agent framework for learning and research"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "rich>=13.0",
    "openai>=1.30",
    "textual>=1.0",
]

[project.scripts]
agent2 = "agent2.app.tui:main"
agent2-tui = "agent2.app.tui:main"
agent2-chat = "agent2.app.chat:main"

[project.optional-dependencies]
memory = ["numpy>=1.26"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "mypy>=1.10"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/agent2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true
