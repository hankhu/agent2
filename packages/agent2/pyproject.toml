[project]
name = "agent2"
version = "0.1.3.25"
description = "A modular agent framework with terminal user interface (TUI)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "agent2-core>=0.1.3.25",
    "textual>=1.0",
]

[project.scripts]
agent2 = "agent2.app.tui:main"
agent2-tui = "agent2.app.tui:main"

[tool.uv.sources]
agent2-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.sources]
"src/agent2/app/tui" = "agent2/app/tui"

[tool.hatch.build.targets.wheel]
only-include = ["src/agent2/app/tui"]
